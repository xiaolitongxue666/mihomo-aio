services:
  subconverter:
    image: tindy2013/subconverter:0.9.0
    container_name: mihomo-aio-subconverter
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SUBCONVERTER_HOST_PORT:-25501}:25500"

  mihomo-core:
    build:
      context: .
      args:
        MIHOMO_VERSION: ${MIHOMO_VERSION:-v1.19.30}
    container_name: mihomo-aio-core
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - subconverter
    volumes:
      - ./data/config:/etc/mihomo
      - ./data/mihomo:/var/lib/mihomo
    ports:
      - "127.0.0.1:${ALL_PROXY_PORT:-17890}:${MIXED_PORT:-7890}"
      - "127.0.0.1:${EXTERNAL_CONTROLLER_PORT:-19090}:${EXTERNAL_CONTROLLER_PORT:-19090}"

  dashboard:
    image: nginx:1.27-alpine
    container_name: mihomo-aio-dashboard
    restart: unless-stopped
    depends_on:
      - mihomo-core
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:${CONTROL_PANEL_PORT:-19091}:${DASHBOARD_PORT:-80}"
